# oauth2-proxy protection for the lantern vhost (see deploy/README.md §3).
# Add `lantern_oauth2` to /etc/nginx/conf.d/upstreams.conf pointing at the
# oauth2-proxy container's :4180, then use this inside the public server block:
#
#   upstream lantern_oauth2 { server 127.0.0.1:4180; }   # or the container IP
#
# server {
#     listen 443 ssl;
#     server_name lantern.aaronjanovitch.com;
#     # ... your ssl_certificate / ssl_certificate_key lines ...

    location /oauth2/ {
        proxy_pass       http://lantern_oauth2;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Scheme         $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        proxy_pass       http://lantern_oauth2;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Scheme         $scheme;
        # auth_request must not forward the body:
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # Pass the authenticated identity upstream so the API can record who acted.
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;

        proxy_pass http://lantern;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
# }
