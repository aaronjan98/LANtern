services:

  # Tails /var/log/dnsmasq.log and stores DNS queries and DHCP events.
  dnsmasq-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /var/log/dnsmasq.log:/data/dnsmasq.log:ro
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.dnsmasq_ingest
        --log /data/dnsmasq.log
        --db /var/lib/lantern/lantern.db
        --from-end

  # Receives NetFlow v9 UDP packets from the router.
  netflow:
    build: .
    image: lantern:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.netflow_collector
        --listen 0.0.0.0
        --port 2055
        --db /var/lib/lantern/lantern.db

  # Reads DHCP lease file and static host entries, updates device inventory every 5 min.
  inventory:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /var/lib/misc/dnsmasq.leases:/data/dnsmasq.leases:ro
      - /etc/dnsmasq.d/dhcp.conf:/data/dhcp.conf:ro
      - /usr/share/nmap/nmap-mac-prefixes:/data/oui.txt:ro
      - lantern_data:/var/lib/lantern
    command:
      - sh
      - -c
      - "while true; do python3 -m lantern.inventory_ingest --leases /data/dnsmasq.leases --dhcp-conf /data/dhcp.conf --db /var/lib/lantern/lantern.db --oui /data/oui.txt; sleep 300; done"

  # Tails the nginx reverse-proxy access logs (service-usage signal for the
  # activity oracle). Reverse-proxy compose bind-mounts its /var/log/nginx to
  # /opt/reverse-proxy/logs; we mount that read-only and tail every *.log.
  nginx-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /opt/reverse-proxy/logs:/data/nginx-logs:ro
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.nginx_ingest
        --log /data/nginx-logs
        --db /var/lib/lantern/lantern.db
        --from-end

  # Tails SSH auth + fail2ban logs (LANtern's security vantage point). Mounts the
  # host logs read-only; the container runs as root so it can read the adm-group
  # files. No --from-end: on first run it ingests the current logs' history so the
  # Security view has data (and the ongoing brute-force attempts) immediately.
  security-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /var/log/auth.log:/data/auth.log:ro
      - /var/log/fail2ban.log:/data/fail2ban.log:ro
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.security_ingest
        --auth-log /data/auth.log
        --fail2ban-log /data/fail2ban.log
        --db /var/lib/lantern/lantern.db
        --host sweetpea

  # Shadow-mode activity oracle: logs what it *would* decide (idle/busy) to
  # activity_verdicts every 5 min, without gating anything. Lets us validate the
  # thresholds against real usage before wiring the SnapRAID sync / Deco reboot.
  activity-shadow:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.activity_shadow
        --db /var/lib/lantern/lantern.db
        --interval 300

  # FastAPI backend — read-only access to the SQLite database.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: lantern-api:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
    environment:
      - LANTERN_DB=/var/lib/lantern/lantern.db

  # React UI served by nginx; proxies /api/ to the api container.
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: lantern-ui:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  lantern_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/lantern
