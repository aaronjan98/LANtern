services:

  # Tails /var/log/dnsmasq.log and stores DNS queries and DHCP events.
  dnsmasq-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /var/log/dnsmasq.log:/data/dnsmasq.log:ro
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.dnsmasq_ingest
        --log /data/dnsmasq.log
        --db /var/lib/lantern/lantern.db
        --from-end

  # Receives NetFlow v9 UDP packets from the router.
  netflow:
    build: .
    image: lantern:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.netflow_collector
        --listen 0.0.0.0
        --port 2055
        --db /var/lib/lantern/lantern.db

  # Reads DHCP lease file and static host entries, updates device inventory every 5 min.
  inventory:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /var/lib/misc/dnsmasq.leases:/data/dnsmasq.leases:ro
      - /etc/dnsmasq.d/dhcp.conf:/data/dhcp.conf:ro
      - /usr/share/nmap/nmap-mac-prefixes:/data/oui.txt:ro
      - lantern_data:/var/lib/lantern
    command:
      - sh
      - -c
      - "while true; do python3 -m lantern.inventory_ingest --leases /data/dnsmasq.leases --dhcp-conf /data/dhcp.conf --db /var/lib/lantern/lantern.db --oui /data/oui.txt; sleep 300; done"

  # Tails the nginx reverse-proxy access logs (service-usage signal for the
  # activity oracle). Reverse-proxy compose bind-mounts its /var/log/nginx to
  # /opt/reverse-proxy/logs; we mount that read-only and tail every *.log.
  nginx-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /opt/reverse-proxy/logs:/data/nginx-logs:ro
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.nginx_ingest
        --log /data/nginx-logs
        --db /var/lib/lantern/lantern.db
        --from-end

  # Tails SSH auth + fail2ban logs (LANtern's security vantage point). Mounts the
  # host logs read-only; the container runs as root so it can read the adm-group
  # files. No --from-end: on first run it ingests the current logs' history so the
  # Security view has data (and the ongoing brute-force attempts) immediately.
  #
  # Mounts the *directory*, not the individual files (like nginx-ingest does):
  # both auth.log and fail2ban.log rotate via rename+create (not copytruncate),
  # which orphans a single-file bind mount onto the old inode -- the container
  # keeps reading a frozen snapshot forever with no error. Bit us 2026-07-18:
  # ingestion silently stalled for 2 months until a container restart (found
  # 2026-09-20 while adding the nginx-exploit jail). A directory mount follows
  # renames within it, so this can't recur.
  security-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /var/log:/data/hostlog:ro
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.security_ingest
        --auth-log /data/hostlog/auth.log
        --fail2ban-log /data/hostlog/fail2ban.log
        --db /var/lib/lantern/lantern.db
        --host sweetpea

  # Shadow-mode activity oracle: logs what it *would* decide (idle/busy) to
  # activity_verdicts every 5 min, without gating anything. Lets us validate the
  # thresholds against real usage before wiring the SnapRAID sync / Deco reboot.
  activity-shadow:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.activity_shadow
        --db /var/lib/lantern/lantern.db
        --interval 300

  # Fold uptime-kuma's monitor history into LANtern -> kuma_monitors/kuma_heartbeats.
  # Mounts the uptime-kuma data volume read-only; copies the live WAL db before reading.
  kuma-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - uptime-kuma_uptime-kuma-data:/kuma:ro
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.kuma_ingest
        --kuma-dir /kuma
        --db /var/lib/lantern/lantern.db
        --interval 60

  # WAN reachability probe -> wan_checks (outage / no-internet timeline).
  # Pure stdlib sockets, so it rides the shared lantern image.
  connectivity:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.wan_ingest
        --db /var/lib/lantern/lantern.db
        --interval 30

  # Idle-gated Ookla speedtest -> speedtest_results (ISP speed history).
  # Its own image (Dockerfile.speedtest) because it needs the Ookla CLI binary;
  # the shared lantern image is stdlib-only. Checks the oracle every tick and
  # only tests when the internet is idle (hard cap keeps history from starving).
  speedtest:
    build:
      context: .
      dockerfile: Dockerfile.speedtest
    image: lantern-speedtest:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.speedtest_ingest
        --db /var/lib/lantern/lantern.db
        --tick 900
        --min-interval-h 2
        --hard-cap-h 12

  # Tailscale peer presence -> tailscale_peers. ONE LocalAPI /status read per
  # minute (no per-device pings); mounts tailscaled's unix socket so no CLI is
  # needed. Feeds the People page's remote-vs-home presence.
  tailscale-ingest:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - /var/run/tailscale/tailscaled.sock:/run/tailscale/tailscaled.sock
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.tailscale_ingest
        --db /var/lib/lantern/lantern.db
        --sock /run/tailscale/tailscaled.sock
        --interval 60

  # Idle-gated Deco WiFi reboot -- the scheduler/brain. Decides when the main
  # Deco (10.0.50.216) is due for its mitigation power-cycle and, per the
  # activity oracle (safe_for_deco_reboot), flips an approved request to 'ready'.
  # It never executes: the Kasa plug lives on the host, so deco-reboot-runner.sh
  # (a systemd timer) claims ready rows and runs ~/deco-reboot/deco-reboot.sh.
  deco-reboot:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.deco_reboot
        --db /var/lib/lantern/lantern.db
        --tick 600
        --interval-days 3
        --api-url http://lantern.home/api/activity/idle
    depends_on:
      - api

  # Nightly retention prune -> bounds DB growth (dns_resolver_events/dns/netflow
  # are the big tables). DELETE-only in small batches, no VACUUM on a tick so it
  # never takes the exclusive lock that would restart the collectors.
  prune:
    build: .
    image: lantern:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
    command: >
      python3 -m lantern.prune
        --db /var/lib/lantern/lantern.db
        --interval 86400

  # Model-agnostic MCP tool surface over LANtern's data. Any MCP client (the
  # Framework's Claude, a local Ollama agent, ...) calls these read-only tools;
  # they proxy the internal API. Its own image because it needs the MCP SDK.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: lantern-mcp:latest
    restart: unless-stopped
    environment:
      - LANTERN_API=http://api:8000/api
    ports:
      - "8765:8765"
    depends_on:
      - api

  # FastAPI backend — read-only access to the SQLite database.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: lantern-api:latest
    restart: unless-stopped
    volumes:
      - lantern_data:/var/lib/lantern
      - /etc/dnsmasq.d:/data/dnsmasq.d:ro   # resolver blocklist (address=/x/0.0.0.0)
    environment:
      - LANTERN_DB=/var/lib/lantern/lantern.db

  # React UI served by nginx; proxies /api/ to the api container.
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: lantern-ui:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  lantern_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/lantern
  uptime-kuma_uptime-kuma-data:
    external: true
