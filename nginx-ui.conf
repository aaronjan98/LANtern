server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved every 10s instead of nginx's default
    # of resolving "api" once at worker startup and caching it for the
    # process's lifetime. Without this, recreating the api container (a normal
    # redeploy) leaves this nginx proxying to a dead IP until *this* container
    # is also restarted -- every /api/ call 502s, with no code bug anywhere.
    # Hit this for real 2026-09-29: an api-only redeploy silently broke the
    # whole UI for ~25 minutes. Using a variable in proxy_pass is required to
    # make nginx honor the resolver instead of resolving at config-parse time.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed build assets are content-addressed -> cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell (index.html, incl. the SPA fallback) must never be cached,
    # or the browser keeps serving a stale bundle after a redeploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
